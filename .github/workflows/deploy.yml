name: Deploy to Production

on:
  push:
    branches: [master]
  # Manual trigger — lets a deploy be verified deliberately instead of pushing a
  # dummy commit. Added 2026-07-30 alongside the move to a forced-command deploy
  # key (see homelab-config/security/SECURITY.md §5.4).
  workflow_dispatch:

# Never cancel a running deploy: one killed after compose removed the old container leaves the app down. A newer push waits its turn.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # The image and docker-compose.yml as the box runs them: uid 101, a read-only filesystem, the page answering on 3040
  # and no redirect carrying the port. A container that cannot start in that shape stops the deploy here, not on the box.
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start the production container in its shape
        run: bash tests/container-smoke.sh

  deploy:
    needs: container
    # A manual run on another branch tests it and deploys nothing.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      id-token: write   # GitHub's OIDC token, the tailnet login
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf # v4.3.0
        with:
          oauth-client-id: ${{ vars.TS_OIDC_CLIENT_ID }}
          audience:        ${{ vars.TS_OIDC_AUDIENCE }}
          tags:            tag:ci
          # The client is pinned too. To bump: a stable version and its
          # tailscale_<ver>_amd64.tgz.sha256 from https://pkgs.tailscale.com/stable/
          version:         1.102.4
          sha256sum:       50748df1045e60b5b695f19f4c56b0da36c019948b440fb456b6584a50f0d8b9

      - name: Deploy via SSH over Tailscale
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host:     ${{ secrets.DEPLOY_HOST }}
          port:     ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key:      ${{ secrets.DEPLOY_SSH_KEY }}
          # pins the target's ECDSA host key (appleboy's client asks for ECDSA first)
          fingerprint: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
          # Generous (the action's default is 10m): a slow build on the box can take ~20 min, and a deploy cut off mid-swap leaves the app down.
          command_timeout: 40m
          script: |
            set -euo pipefail
            git config --global --add safe.directory /apps/martin-portfolio
            cd /apps/martin-portfolio
            git fetch origin
            git reset --hard origin/master
            docker compose build --no-cache
            docker compose up -d
            echo "Martin portfolio deploy complete"

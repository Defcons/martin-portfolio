name: Deploy to Production

on:
  push:
    branches: [master]
  # Manual trigger — lets a deploy be verified deliberately instead of pushing a
  # dummy commit. Added 2026-07-30 alongside the move to a forced-command deploy
  # key (see homelab-config/security/SECURITY.md §5.4).
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret:    ${{ secrets.TS_OAUTH_SECRET }}
          tags:            tag:ci
          version:         latest

      - name: Deploy via SSH over Tailscale
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.DEPLOY_HOST }}
          port:     ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key:      ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            git config --global --add safe.directory /apps/martin-portfolio
            cd /apps/martin-portfolio
            git fetch origin
            git reset --hard origin/master
            docker compose build --no-cache
            docker compose up -d
            echo "Martin portfolio deploy complete"

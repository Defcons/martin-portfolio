server {
    # 3040 is also the published host port (container and host port are equal). A non-default port makes nginx put
    # ":3040" into absolute redirects (a directory URL without its slash), so they are relative instead.
    listen 3040;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    # No access log in the container: NPM in front logs each request (without the visitor's address, through the
    # tunnel), and the stock log format would also write X-Forwarded-For, which carries it (privacy.html).
    access_log off;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/javascript text/xml application/xml;
    gzip_min_length 256;

    # Cache static assets. An add_header here drops the server-level ones, so the security headers are repeated.
    location ~* \.(css|js|png|jpg|jpeg|gif|webp|ico|svg|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # SPA fallback. expires -1 makes browsers revalidate the HTML on every visit
    # (cheap 304 when unchanged) so new ?v=N asset references are picked up promptly.
    # Use expires (not add_header) here to preserve the server-level security headers.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }

    # Deny hidden files
    location ~ /\. {
        deny all;
        return 404;
    }
}
